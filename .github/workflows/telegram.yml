
name: Publicar Ofertas Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publicar produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
  python -c "import os, urllib.request; u=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/products?select=id&limit=1'; k=os.environ['SUPABASE_KEY']; r=urllib.request.Request(u,headers={'apikey':k,'Authorization':'Bearer '+k}); print('Resposta Supabase:',urllib.request.urlopen(r,timeout=30).status)"
